; Heroes Artifact Slot Expanded - settings (read at game start and at every new game)
; 14 new artifact slots per hero: 7 misc, 4 ring, a second armour, weapon and necklace slot.
; Misc: with the catapult in its own slot (vanilla, or Emerald with Enable6thSlot=0) 5 normal + 7 new misc slots;
; with Emerald's 6th misc slot on (the catapult slot used as misc) 6 normal + 6 new, Misc7 then does not exist.

[General]
; 1 = mod active, 0 = all hooks step aside (artifacts in new slots stay stored but give no effect and are not shown)
Enabled=1
; log file detail: 0 = no log, 1 = important lines only, 2 = + every equip / save / load (default, for bug reports),
; 3 = trace. Log file: Runtime\Heroes Artifact Slot Expanded\hase_log.txt (started fresh at every game launch,
; the previous one is kept as hase_log.old.txt)
Debug=2
; 1 = short hints on the adventure screen (e.g. "only ring artifacts fit an extra ring slot"), 0 = none (default)
ScreenMessages=0
; gained artifacts (map, battle loot, events, scripts) that find no free normal slot of their kind go into the first
; free new slot of that kind instead of the backpack. 1 = all heroes (as the game does for normal slots),
; 2 = human players only, 0 = off (backpack)
AutoEquip=1

[Slots]
; every new slot can be switched off. 1 = on, 0 = off: no slot and no frame picture on any screen (hero, meeting,
; merchant, altar). Artifacts a game already has in a switched-off slot go to the hero's backpack when the game is
; loaded (a full backpack keeps them stored).
; Misc1 = bottom of the left column, Misc2..Misc7 = right column, top to bottom (with Emerald's 6th misc slot on:
; Misc1..Misc6 = right column, top to bottom).
Misc1=1
Misc2=1
Misc3=1
Misc4=1
Misc5=1
Misc6=1
Misc7=1
; Ring1 / Ring2 = below the left / right ring slot, Ring3 / Ring4 = left / right of the boots.
Ring1=1
Ring2=1
Ring3=1
Ring4=1
; Armor = second armour (below the armour), Weapon = second weapon (beside the second necklace), Neck = second
; necklace (below the necklace).
Armor=1
Weapon=1
Neck=1
; older switches, still read: ExtraRings=0 turns all four new ring slots off, ExtraArmor=0 the second armour slot.
ExtraRings=1
ExtraArmor=1

[HeroScreen]
; 1 = show the view switch (only with Legend Heroes): a small round gold button that switches between
; the slot view and the full portrait (its icon shows the view a click switches to). 0 = no switch: every screen
; (hero, meeting, merchant, altar) keeps the slot view.
ToggleButton=1
; 1 = on the hero screen the switch sits at the right end of the hero name panel (default; when another mod already
; has an item there, e.g. 10SSkills' specialty icon, it goes into the doll), 0 = inside the doll
SwitchInNamePanel=1
; place of the switch in the name panel (hero screen dialog coordinates, its top-left corner). Default 278,54.
PanelX=278
PanelY=54
; place of the view switch (22x22) inside the doll: its top-left corner, counted from the doll's top-left corner.
; Default 83,14 = the free cell left of the helmet. Used on both dolls of the meeting (trade) screen, and on the hero
; screen with SwitchInNamePanel=0.
; Up to 1.0.1 the switch sat in Legend Heroes' button row at 510,430 (over ERA Scripts' Night Scouting button);
; the old keys ToggleX / ToggleY here and in [MeetingScreen] are no longer read.
SwitchX=83
SwitchY=14

[Battle]
; 1 = Emerald per-artifact effects also from the new slots: battle-start auto-cast / auto-summon spells and scripts,
; before/after-battle scripts, daily mana / creature upgrade / scripts (known Emerald build only, else off + log). 0 = off
EmeraldEvents=1
; 1 = a defeated hero's new-slot artifacts go to the winner like his other artifacts (vanilla rule)
; 0 = they stay with the defeated hero
LoserExtrasToWinner=1

[Phase3]
; (section name kept for older ini files)
; 1 = luck / morale popups name the artifacts in the new slots and their value, 0 = off
PopupNames=1
; 1 = altar of sacrifice (artifacts) shows the new slots (with Legend Heroes: in the slot view), 0 = off
Altar=1
; 1 = artifact merchant (sell) shows the new slots (with Legend Heroes: in the slot view), 0 = off
Merchant=1
